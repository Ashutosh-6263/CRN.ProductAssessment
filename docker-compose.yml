services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: crn-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - crn-network

  api:
    build:
      context: .
      dockerfile: CRN.API/Dockerfile
    container_name: crn-api
    depends_on:
      - sqlserver
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Key: "CRN-ProductAssessment-SuperSecretKey-2026-AtLeast32Characters!"
      Jwt__Issuer: "CRN.API"
      Jwt__Audience: "CRN.Client"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=CRNProductAssessmentDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True"
    ports:
      - "8080:8080"
    networks:
      - crn-network

volumes:
  sqlserver_data:

networks:
  crn-network:
    driver: bridge